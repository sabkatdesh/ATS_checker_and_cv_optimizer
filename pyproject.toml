[project]
name = "cv-optimizer-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.135.1",
    "jinja2==3.1.6",
    "langchain-core==1.4.0",
    "langchain-openai==1.1.7",
    "langgraph==1.2.1",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "sentry-sdk==2.74.0",
    "structlog==26.1.0",
    "supabase==2.28.0",
    "uvicorn==0.41.0",
    "weasyprint==68.1",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "ruff==0.17.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["app/**/*.py", "tests/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501"]
"scripts/**" = ["T20"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
files = ["app"]
